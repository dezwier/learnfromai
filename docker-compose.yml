services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mastery
      POSTGRES_PASSWORD: mastery
      POSTGRES_DB: adaptive_mastery
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastery"]
      interval: 5s
      timeout: 5s
      retries: 10
